<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thai Daily Vlog Journal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600&display=swap');
:root{
  --bg:#faf8f4;--card:#fff;--text:#1f2937;--muted:#7a7068;--line:#e8e2d9;
  --accent:#c8622a;--accent2:#4a7c6f;--accent3:#7c5c9a;--accent4:#6ea8d6;
  --tag-bg:#f2ede6;--soft:#fff7ed;--green:#eef6f1;--blue:#eef5fb;--purple:#f4eff8;
  --shadow:0 1px 4px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0} body{background:var(--bg);color:var(--text);font-family:'Noto Serif TC',Georgia,serif;font-size:14px;line-height:1.65;min-height:100vh} button,input,textarea{font-family:inherit}
header{background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:15px 22px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.logo{font-weight:700;letter-spacing:.02em}.logo span{color:var(--accent)}
.tabs{display:flex;gap:2px;background:var(--tag-bg);border-radius:10px;padding:4px;overflow:auto}.tab-btn{border:none;background:none;cursor:pointer;padding:7px 13px;border-radius:8px;font-size:12.5px;color:var(--muted);white-space:nowrap}.tab-btn.active{background:#fff;color:var(--text);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;margin-left:4px}.header-actions{display:flex;gap:7px;flex-wrap:wrap}.btn-sm{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:6px 10px;font-size:11.5px;cursor:pointer;color:var(--muted)}.btn-sm:hover{border-color:var(--accent);color:var(--accent)}
.page{display:none;padding:24px;max-width:1180px;margin:0 auto}.page.active{display:block}.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px}.panel h3{font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.row{margin-bottom:12px} label{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin-bottom:5px} input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);padding:8px 10px;font-size:13.5px;resize:vertical} input:focus,textarea:focus{outline:none;border-color:var(--accent)}.thai{font-family:'Noto Sans Thai',sans-serif}.roman{font-family:'JetBrains Mono',monospace}.btn-main{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-weight:700;cursor:pointer}.btn-main:hover{opacity:.9}.hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.collapsible-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.collapse-toggle{width:100%;border:none;background:linear-gradient(135deg,var(--soft),#fff);color:var(--text);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;font-weight:700;font-size:13px;text-align:left}
.collapse-toggle .sub{font-weight:500;color:var(--muted);font-size:11.5px;margin-left:6px}
.collapse-body{display:none;padding:16px 18px 18px;border-top:1px solid var(--line)}
.collapsible-panel.open .collapse-body{display:block}
.collapsible-panel.open .arrow{transform:rotate(180deg)}
.arrow{transition:transform .15s ease;color:var(--muted)}
.journal-card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}.journal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}.journal-title{font-size:18px;font-weight:700}.date{font-family:'JetBrains Mono',monospace;color:var(--accent);font-size:12px;margin-bottom:3px}.meta{color:var(--muted);font-size:12.5px}.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.tag{background:var(--tag-bg);border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:11.5px;color:var(--muted)}.tag.mood{background:var(--purple);color:var(--accent3)}.actions{display:flex;gap:6px;align-items:center}.round{background:#fff;border:1px solid var(--line);border-radius:99px;width:32px;height:32px;cursor:pointer;color:var(--muted)}.round:hover{border-color:var(--accent2);color:var(--accent2)}.round.active{border-color:var(--accent3);color:var(--accent3);background:var(--purple)}
.sentence-list{display:grid;gap:8px}.sent{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;background:#fffdf9;border:1px solid var(--line);border-radius:10px;padding:10px}.sent-num{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:11px;padding-top:4px}.sent-thai{font-family:'Noto Sans Thai',sans-serif;font-size:16px;font-weight:500}.sent-roman{font-family:'JetBrains Mono',monospace;font-size:12px;color:#9a8878}.sent-en,.sent-zh{font-size:12.5px;color:var(--muted)}
.sent-vocab{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.sent-vocab-chip{display:inline-flex;align-items:center;gap:5px;background:var(--tag-bg);border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:11.5px;cursor:pointer}
.sent-vocab-chip:hover{border-color:var(--accent2);background:var(--green)}
.sent-vocab-chip .th{font-family:'Noto Sans Thai',sans-serif;font-weight:600;color:var(--text)}
.sent-vocab-chip .roman{font-family:'JetBrains Mono',monospace;color:#9a8878;font-size:10.5px}
.sent-vocab-chip .en{color:var(--muted);font-size:10.5px}
.sent-vocab-note{font-size:11px;color:var(--muted);margin-top:3px}
.sent.key{background:var(--soft);border-color:#efd2ba}.section-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 8px}.chip-grid{display:flex;flex-wrap:wrap;gap:7px}.chip{display:inline-flex;align-items:center;gap:6px;background:var(--tag-bg);border:1px solid transparent;border-radius:8px;padding:5px 10px;font-size:12px}.chip:hover{border-color:var(--accent2);background:var(--green)}.chip .th{font-family:'Noto Sans Thai',sans-serif;font-weight:600}.chip .en{color:var(--muted);font-size:11px}.note-box{border-left:3px solid var(--accent2);background:var(--green);padding:10px 12px;border-radius:0 8px 8px 0;color:var(--muted);font-size:13px}.empty{text-align:center;padding:60px 20px;color:var(--muted)}.empty .big{font-size:38px;margin-bottom:10px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 18px;text-align:center}.stat .num{font-size:22px;color:var(--accent);font-weight:700}.stat .lbl{font-size:11px;color:var(--muted)}
.review-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}.rating-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.rating-btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:12px}.r0{border-color:#f0a0a0}.r1{border-color:#f0c070}.r2{border-color:#a0c8a0}.r3{border-color:#a0c0e0}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:300;align-items:center;justify-content:center;padding:18px}.modal-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.18);width:min(760px,94vw);max-height:88vh;overflow:auto;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.x{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer}
#tts-warning{position:fixed;right:18px;bottom:18px;background:#333;color:#fff;border-radius:8px;padding:10px 14px;font-size:12px;display:none;z-index:999}
@media(max-width:760px){.page{padding:16px}.grid2,.grid3{grid-template-columns:1fr}.journal-head{flex-direction:column}.sent{grid-template-columns:1fr auto}.sent-num{display:none}header{align-items:flex-start}}
</style>
</head>
<body>
<header>
  <div class="logo">🎥 Thai <span>Vlog Journal</span></div>
  <div class="tabs">
    <button class="tab-btn active" onclick="showPage(0)">Journal</button>
    <button class="tab-btn" onclick="showPage(1)">Key Sentences <span class="badge" id="key-count">0</span></button>
    <button class="tab-btn" onclick="showPage(2)">Vocab / Patterns</button>
    <button class="tab-btn" onclick="showPage(3)">Favorite <span class="badge" id="fav-count">0</span></button>
    <button class="tab-btn" onclick="showPage(4)">Review <span class="badge" id="review-count">0</span></button>
  </div>
  <div class="header-actions">
    <button class="btn-sm" onclick="openPasteModal()">貼上 JSON</button>
    <button class="btn-sm" onclick="exportData()">匯出</button>
    <button class="btn-sm" onclick="document.getElementById('import-file').click()">匯入</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</header>

<div class="page active" id="page-0">
  <div class="collapsible-panel" id="quick-add-panel">
    <button class="collapse-toggle" onclick="toggleQuickAdd()">
      <span>＋ 備用：手動新增 / 貼上單篇 JSON <span class="sub">平常可收起，主要使用右上角「貼上 JSON」</span></span>
      <span class="arrow">⌄</span>
    </button>
    <div class="collapse-body">
      <div class="grid3 row">
        <div><label>日期</label><input id="f-date" class="roman" type="text" placeholder="2026-06-05"></div>
        <div><label>標題</label><input id="f-title" type="text" placeholder="颱風前夕的一天"></div>
        <div><label>心情 mood，用逗號分隔</label><input id="f-mood" type="text" placeholder="tired, chaotic, self-blame"></div>
      </div>
      <div class="row"><label>Tags，用逗號分隔</label><input id="f-tags" type="text" placeholder="飲食, 情緒, 家教, 通勤, 泰文學習"></div>
      <div class="row"><label>貼上 AI 產出的 Vlog JSON</label><textarea id="f-json" rows="8" class="roman" placeholder='可貼單篇 JSON，例如 {"date":"...","title":"...","sentences":[...],"vocab":[...]}'></textarea><div class="hint">備用功能：如果不想開右上角「貼上 JSON」，可在這裡快速加入單篇。</div></div>
      <button class="btn-main" onclick="addVlogFromForm()">加入 Journal</button>
    </div>
  </div>
  <div id="journal-list"></div>
</div>

<div class="page" id="page-1"><div id="key-list"></div></div>
<div class="page" id="page-2"><div id="analysis-list"></div></div>
<div class="page" id="page-3"><div id="fav-list"></div></div>
<div class="page" id="page-4"><div class="stats" id="stats-row"></div><div id="review-list"></div></div>

<div class="modal" id="paste-modal">
  <div class="modal-card">
    <div class="modal-head"><strong>貼上 AI 整理的 Vlog JSON</strong><button class="x" onclick="closePasteModal()">×</button></div>
    <textarea id="paste-input" rows="16" class="roman" placeholder="貼上單篇 JSON、array，或 {entries:[...]}..."></textarea>
    <div id="paste-error" style="display:none;color:#e05;font-size:12px;margin-top:6px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap"><button class="btn-sm" onclick="closePasteModal()">取消</button><button class="btn-sm" onclick="pasteReplace()">覆蓋匯入</button><button class="btn-main" onclick="pasteImport()">合併匯入</button></div>
  </div>
</div>

<div class="modal" id="edit-modal">
  <div class="modal-card">
    <div class="modal-head"><strong>編輯這篇 Vlog JSON</strong><button class="x" onclick="closeEditModal()">×</button></div>
    <textarea id="edit-input" rows="18" class="roman" placeholder="這裡會顯示整篇 Vlog JSON，可直接修改後儲存。"></textarea>
    <div id="edit-error" style="display:none;color:#e05;font-size:12px;margin-top:6px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn-sm" onclick="closeEditModal()">取消</button><button class="btn-main" onclick="saveEditEntry()">儲存</button></div>
  </div>
</div>
<div id="tts-warning">⚠️ 請在 Chrome / Edge 使用以確保泰文 TTS 正常</div>

<script>
const STORAGE_KEY='thai-vlog-journal-v1';
let data={entries:[]};
function today(){return new Date().toISOString().slice(0,10)}
function load(){const raw=localStorage.getItem(STORAGE_KEY);if(raw){try{data=JSON.parse(raw)}catch(e){}} if(!data.entries)data={entries:[]}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data));updateBadges()}
function uid(){return Date.now().toString()+Math.random().toString(36).slice(2)}
function normEntry(e){
  e.id=e.id||uid(); e.date=e.date||today(); e.title=e.title||'Untitled Vlog';
  e.mood=Array.isArray(e.mood)?e.mood:(e.mood?String(e.mood).split(',').map(x=>x.trim()).filter(Boolean):[]);
  e.tags=Array.isArray(e.tags)?e.tags:(e.tags?String(e.tags).split(',').map(x=>x.trim()).filter(Boolean):[]);
  e.sentences=(e.sentences||[]).map((s,i)=>({id:s.id||uid(),thai:s.thai||'',roman:s.roman||'',english:s.english||s.eng||'',chinese:s.chinese||s.zh||'',type:s.type||'vlog',key:!!s.key,favorite:!!s.favorite,interval:s.interval||1,ease:s.ease||2.5,next_review:s.next_review||today(),last_review:s.last_review||null,review_count:s.review_count||0,vocab:Array.isArray(s.vocab)?s.vocab:[]}));
  e.key_sentences=(e.key_sentences||[]).map((s,i)=>({id:s.id||uid(),thai:s.thai||'',roman:s.roman||'',english:s.english||s.eng||'',chinese:s.chinese||s.zh||'',key:true,favorite:!!s.favorite,interval:s.interval||1,ease:s.ease||2.5,next_review:s.next_review||today(),last_review:s.last_review||null,review_count:s.review_count||0,vocab:Array.isArray(s.vocab)?s.vocab:[]}));
  e.vocab=e.vocab||[]; e.patterns=e.patterns||[]; e.collocations=e.collocations||[]; e.notes=e.notes||'';
  return e;
}
function allReviewItems(){let arr=[];data.entries.forEach(e=>{e.key_sentences.forEach(s=>arr.push({entry:e,item:s,kind:'key'}));e.sentences.filter(s=>s.favorite||s.key).forEach(s=>arr.push({entry:e,item:s,kind:'sent'}));});return arr}
function isDue(s){return !s.next_review||s.next_review<=today()}
function sm2(s,r){const now=new Date();if(r===0){s.interval=1;s.ease=Math.max(1.3,(s.ease||2.5)-.3)}else if(r===1){s.interval=1;s.ease=Math.max(1.3,(s.ease||2.5)-.15)}else if(r===2){s.interval=s.interval<=1?3:Math.round(s.interval*(s.ease||2.5))}else{s.interval=s.interval<=1?4:Math.round(s.interval*(s.ease||2.5));s.ease=Math.min(3,(s.ease||2.5)+.1)}s.last_review=today();let n=new Date();n.setDate(n.getDate()+s.interval);s.next_review=n.toISOString().slice(0,10);s.review_count=(s.review_count||0)+1}
function showPage(n){document.querySelectorAll('.page').forEach((p,i)=>p.classList.toggle('active',i===n));document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===n)); if(n===0)renderJournal(); if(n===1)renderKeys(); if(n===2)renderAnalysis(); if(n===3)renderFavs(); if(n===4)renderReview()}
function toggleQuickAdd(){document.getElementById('quick-add-panel').classList.toggle('open')}
function speak(text,btn){if(!('speechSynthesis' in window)){warn();return} speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='th-TH';u.rate=.86;if(btn){btn.classList.add('active');u.onend=()=>btn.classList.remove('active');u.onerror=()=>btn.classList.remove('active')}speechSynthesis.speak(u)}
function warn(){const w=document.getElementById('tts-warning');w.style.display='block';setTimeout(()=>w.style.display='none',3000)}
function entryCard(e){return `<div class="journal-card"><div class="journal-head"><div><div class="date">${esc(e.date)}</div><div class="journal-title">${esc(e.title)}</div><div class="meta">${e.sentences.length} sentences｜${e.key_sentences.length} key sentences</div><div class="tag-row">${e.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${e.mood.map(t=>`<span class="tag mood">${esc(t)}</span>`).join('')}</div></div><div class="actions"><button class="round" title="播放全文" onclick="playEntry('${e.id}',this)">🔊</button><button class="round" title="編輯 JSON" onclick="openEditModal('${e.id}')">✏️</button><button class="round" title="刪除" onclick="deleteEntry('${e.id}')">✕</button></div></div>${sentenceList(e.sentences,e.id)}${e.notes?`<div class="section-title">Notes</div><div class="note-box">${esc(e.notes)}</div>`:''}</div>`}
function sentenceVocabHtml(s){
  if(!s.vocab || !Array.isArray(s.vocab) || !s.vocab.length)return '';
  return `<div class="sent-vocab">${s.vocab.map(v=>`
    <span class="sent-vocab-chip" onclick="speak('${js(v.thai||'')}',this)" title="${esc(v.note||'')}">
      <span class="th">${esc(v.thai||'')}</span>
      ${(v.eng||v.english)?`<span class="en">${esc(v.eng||v.english)}</span>`:''}
    </span>
  `).join('')}</div>`;
}
function sentenceList(list,eid){if(!list.length)return '<div class="empty">沒有句子</div>';return `<div class="sentence-list">${list.map((s,i)=>`<div class="sent ${s.key?'key':''}"><div class="sent-num">${String(i+1).padStart(2,'0')}</div><div><div class="sent-thai">${esc(s.thai)}</div>${s.roman?`<div class="sent-roman">${esc(s.roman)}</div>`:''}${s.english?`<div class="sent-en">${esc(s.english)}</div>`:''}${s.chinese?`<div class="sent-zh">${esc(s.chinese)}</div>`:''}${sentenceVocabHtml(s)}</div><div class="actions"><button class="round" onclick="speak('${js(s.thai)}',this)">🔊</button><button class="round ${s.favorite?'active':''}" onclick="toggleSentFav('${eid}','${s.id}')">♥</button></div></div>`).join('')}</div>`}
function renderJournal(){const el=document.getElementById('journal-list');if(!data.entries.length){el.innerHTML='<div class="empty"><div class="big">🎥</div>還沒有 Daily Vlog，先貼上第一篇 JSON 吧！</div>';return} el.innerHTML=data.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(entryCard).join('')}
function renderKeys(){let items=[];data.entries.forEach(e=>e.key_sentences.forEach(s=>items.push({e,s})));const el=document.getElementById('key-list');if(!items.length){el.innerHTML='<div class="empty"><div class="big">⭐</div>還沒有 Key Sentences</div>';return}el.innerHTML=items.map(({e,s})=>`<div class="journal-card"><div class="date">${esc(e.date)}｜${esc(e.title)}</div>${sentenceList([s],e.id)}</div>`).join('')}
function renderAnalysis(){const el=document.getElementById('analysis-list');if(!data.entries.length){el.innerHTML='<div class="empty"><div class="big">🧩</div>還沒有可分析內容</div>';return} el.innerHTML=data.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<div class="journal-card"><div class="date">${esc(e.date)}</div><div class="journal-title">${esc(e.title)}</div>${analysisSection('Vocabulary & Chunks',e.vocab)}${analysisSection('Patterns',e.patterns)}${analysisSection('Collocations',e.collocations)}</div>`).join('')}
function analysisSection(title,arr){if(!arr||!arr.length)return '';return `<div class="section-title">${title}</div><div class="chip-grid">${arr.map(v=>`<span class="chip" onclick="speak('${js(v.thai||v.pattern||v.text||'')}',this)"><span class="th">${esc(v.thai||v.pattern||v.text||'')}</span>${(v.eng||v.english||v.meaning)?`<span class="en">${esc(v.eng||v.english||v.meaning)}</span>`:''}${v.note?`<span class="en">｜${esc(v.note)}</span>`:''}</span>`).join('')}</div>`}
function renderFavs(){let items=[];data.entries.forEach(e=>e.sentences.concat(e.key_sentences).filter(s=>s.favorite).forEach(s=>items.push({e,s})));const el=document.getElementById('fav-list');if(!items.length){el.innerHTML='<div class="empty"><div class="big">♥</div>還沒有最愛句子</div>';return}el.innerHTML=items.map(({e,s})=>`<div class="journal-card"><div class="date">${esc(e.date)}｜${esc(e.title)}</div>${sentenceList([s],e.id)}</div>`).join('')}
function renderReview(){const all=allReviewItems();const due=all.filter(x=>isDue(x.item));document.getElementById('stats-row').innerHTML=`<div class="stat"><div class="num">${due.length}</div><div class="lbl">今日待複習</div></div><div class="stat"><div class="num">${all.filter(x=>x.item.last_review===today()).length}</div><div class="lbl">今日已複習</div></div><div class="stat"><div class="num">${all.length}</div><div class="lbl">複習句總數</div></div>`;const el=document.getElementById('review-list');if(!due.length){el.innerHTML='<div class="empty"><div class="big">✅</div>今天沒有待複習的 Vlog 句子</div>';return}el.innerHTML=due.map(({entry,item})=>`<div class="review-item" id="rev-${item.id}"><div class="date">${esc(entry.date)}｜${esc(entry.title)}</div>${sentenceList([item],entry.id)}<div class="rating-row"><button class="rating-btn r0" onclick="rateItem('${entry.id}','${item.id}',0)">😰 忘了</button><button class="rating-btn r1" onclick="rateItem('${entry.id}','${item.id}',1)">🤔 模糊</button><button class="rating-btn r2" onclick="rateItem('${entry.id}','${item.id}',2)">😊 記得</button><button class="rating-btn r3" onclick="rateItem('${entry.id}','${item.id}',3)">⭐ 很熟</button></div></div>`).join('')}
function rateItem(eid,sid,r){const e=data.entries.find(x=>x.id===eid);if(!e)return;const s=e.sentences.concat(e.key_sentences).find(x=>x.id===sid);if(!s)return;sm2(s,r);save();renderReview()}
function toggleSentFav(eid,sid){const e=data.entries.find(x=>x.id===eid);if(!e)return;const s=e.sentences.concat(e.key_sentences).find(x=>x.id===sid);if(!s)return;s.favorite=!s.favorite;save();renderJournal();renderKeys();renderFavs()}
function playEntry(eid,btn){const e=data.entries.find(x=>x.id===eid);if(!e)return;speak(e.sentences.map(s=>s.thai).join('。'),btn)}
function deleteEntry(eid){if(!confirm('確定刪除這篇 Vlog？'))return;data.entries=data.entries.filter(e=>e.id!==eid);save();renderJournal()}
function addVlogFromForm(){let raw=document.getElementById('f-json').value.trim();let e;if(raw){try{e=JSON.parse(raw)}catch(err){alert('JSON 格式錯誤');return}}else{e={date:document.getElementById('f-date').value||today(),title:document.getElementById('f-title').value||'Untitled Vlog',mood:document.getElementById('f-mood').value,tags:document.getElementById('f-tags').value,sentences:[]}}; e.date=e.date||document.getElementById('f-date').value||today();e.title=e.title||document.getElementById('f-title').value||'Untitled Vlog';if(!e.mood)e.mood=document.getElementById('f-mood').value;if(!e.tags)e.tags=document.getElementById('f-tags').value;data.entries.unshift(normEntry(e));save();document.getElementById('f-json').value='';renderJournal()}
function openPasteModal(){document.getElementById('paste-modal').style.display='flex';setTimeout(()=>document.getElementById('paste-input').focus(),50)}function closePasteModal(){document.getElementById('paste-modal').style.display='none';document.getElementById('paste-input').value='';document.getElementById('paste-error').style.display='none'}
function parseEntriesPayload(raw){
  let parsed=typeof raw==='string'?JSON.parse(raw):raw;
  let arr=Array.isArray(parsed)?parsed:(parsed.entries?parsed.entries:[parsed]);
  return arr.map(e=>normEntry(e));
}

function reviewScoreOfEntry(e){
  let score=0;
  (e.key_sentences||[]).forEach(s=>score+=(s.review_count||0));
  (e.sentences||[]).forEach(s=>score+=(s.review_count||0));
  return score;
}

function mergeSentenceList(localList, incomingList){
  const index=new Map((localList||[]).map(s=>[s.id,s]));
  (incomingList||[]).forEach(s=>{
    if(!s.id){s.id=uid();}
    if(index.has(s.id)){
      const local=index.get(s.id);
      if((s.review_count||0)>(local.review_count||0)){
        Object.assign(local,s);
      }else{
        // Keep local review progress, but allow text corrections from import when local has no content.
        ['thai','roman','english','chinese','type','key','vocab'].forEach(k=>{
          if(k==='vocab' && Array.isArray(s[k])) local[k]=s[k];
          else if((local[k]===undefined||local[k]===''||local[k]===false) && s[k]) local[k]=s[k];
        });
      }
    }else{
      localList.push(s);
      index.set(s.id,s);
    }
  });
}

function mergeEntry(incoming){
  if(!incoming.id){incoming.id=uid();}
  const local=data.entries.find(e=>e.id===incoming.id);
  if(!local){
    data.entries.unshift(incoming);
    return 'added';
  }

  const incomingScore=reviewScoreOfEntry(incoming);
  const localScore=reviewScoreOfEntry(local);

  // Update entry-level metadata; keep id stable.
  ['date','title','summary','notes'].forEach(k=>{
    if(incoming[k]!==undefined) local[k]=incoming[k];
  });
  local.mood=incoming.mood||local.mood||[];
  local.tags=incoming.tags||local.tags||[];
  local.vocab=incoming.vocab||local.vocab||[];
  local.patterns=incoming.patterns||local.patterns||[];
  local.collocations=incoming.collocations||local.collocations||[];

  mergeSentenceList(local.sentences, incoming.sentences);
  mergeSentenceList(local.key_sentences, incoming.key_sentences);

  return incomingScore>localScore?'updated':'merged';
}

function mergeEntries(arr){
  let added=0, updated=0, merged=0;
  arr.forEach(e=>{
    const result=mergeEntry(e);
    if(result==='added') added++;
    else if(result==='updated') updated++;
    else merged++;
  });
  return {added,updated,merged};
}

function replaceEntries(arr){
  data.entries=arr;
}

function pasteImport(){
  const raw=document.getElementById('paste-input').value.trim();
  const err=document.getElementById('paste-error');
  try{
    const arr=parseEntriesPayload(raw);
    const result=mergeEntries(arr);
    save();closePasteModal();renderJournal();updateBadges();
    alert(`✅ 合併完成！新增 ${result.added} 篇，更新複習進度 ${result.updated} 篇，合併 ${result.merged} 篇。`);
  }catch(e){
    err.textContent='格式錯誤，請確認是正確 JSON';
    err.style.display='block';
  }
}

function pasteReplace(){
  const raw=document.getElementById('paste-input').value.trim();
  const err=document.getElementById('paste-error');
  try{
    const arr=parseEntriesPayload(raw);
    if(!confirm(`確定要覆蓋目前全部資料，改成這 ${arr.length} 篇 Vlog？建議先匯出備份。`))return;
    replaceEntries(arr);
    save();closePasteModal();renderJournal();updateBadges();
    alert(`✅ 覆蓋完成！目前共有 ${arr.length} 篇 Vlog。`);
  }catch(e){
    err.textContent='格式錯誤，請確認是正確 JSON';
    err.style.display='block';
  }
}

function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`thai-vlog-journal-${today()}.json`;
  a.click();
}

function importData(ev){
  const file=ev.target.files[0];
  if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const arr=parseEntriesPayload(e.target.result);
      const mode=confirm(`按「確定」= 合併匯入並更新進度\n按「取消」= 覆蓋全部資料`);
      if(mode){
        const result=mergeEntries(arr);
        save();renderJournal();updateBadges();
        alert(`✅ 合併完成！新增 ${result.added} 篇，更新複習進度 ${result.updated} 篇，合併 ${result.merged} 篇。`);
      }else{
        if(!confirm(`確定要覆蓋目前全部資料，改成這 ${arr.length} 篇 Vlog？建議先匯出備份。`))return;
        replaceEntries(arr);
        save();renderJournal();updateBadges();
        alert(`✅ 覆蓋完成！目前共有 ${arr.length} 篇 Vlog。`);
      }
    }catch{
      alert('檔案格式錯誤');
    }
  };
  r.readAsText(file);
  ev.target.value='';
}

let editingEntryId=null;
function openEditModal(eid){
  const e=data.entries.find(x=>x.id===eid);
  if(!e)return;
  editingEntryId=eid;
  document.getElementById('edit-input').value=JSON.stringify(e,null,2);
  document.getElementById('edit-error').style.display='none';
  document.getElementById('edit-modal').style.display='flex';
}

function closeEditModal(){
  editingEntryId=null;
  document.getElementById('edit-modal').style.display='none';
  document.getElementById('edit-input').value='';
  document.getElementById('edit-error').style.display='none';
}

function saveEditEntry(){
  const err=document.getElementById('edit-error');
  try{
    const edited=normEntry(JSON.parse(document.getElementById('edit-input').value));
    if(editingEntryId && edited.id!==editingEntryId){
      edited.id=editingEntryId;
    }
    const i=data.entries.findIndex(x=>x.id===edited.id);
    if(i>=0)data.entries[i]=edited;
    else data.entries.unshift(edited);
    save();renderJournal();renderKeys();renderAnalysis();renderFavs();renderReview();closeEditModal();
    alert('✅ 已儲存修改');
  }catch(e){
    err.textContent='JSON 格式錯誤，請檢查逗號、引號或括號。';
    err.style.display='block';
  }
}

function updateBadges(){document.getElementById('fav-count').textContent=data.entries.reduce((n,e)=>n+e.sentences.concat(e.key_sentences).filter(s=>s.favorite).length,0);document.getElementById('key-count').textContent=data.entries.reduce((n,e)=>n+e.key_sentences.length,0);document.getElementById('review-count').textContent=allReviewItems().filter(x=>isDue(x.item)).length}
function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function js(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ')}
document.getElementById('f-date').value=today();load();renderJournal();updateBadges();
</script>
